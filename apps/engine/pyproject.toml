[project]
name = "faro-engine"
version = "0.1.0"
description = "Motor local de Faro (sidecar Python con FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Propietario. Todos los derechos reservados." }
dependencies = [
    "anyio>=4.15.1",
    "apscheduler>=3.11.3,<4",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "idna>=3.20",
    "langgraph==1.2.13",
    "langgraph-checkpoint==4.2.0",
    "litellm==1.104.0",
    "pydantic>=2.13.5",
    "sqlcipher3-wheels>=0.5.7,<0.6",
    "structlog>=26.1.0",
    "truststore==0.10.4",
    "uvicorn>=0.54.0,<0.55",  # core/server.py usa detalles internos de uvicorn 0.54
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "faro_engine"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "PT", "RET",
    "ARG", "PL", "T20", "ASYNC", "BLE", "TRY", "PTH",
]
ignore = [
    "PLR2004", # números mágicos en comparaciones (puertos, códigos HTTP)
    "TRY003",  # mensajes largos en excepciones
    "TRY400",  # log.error a propósito: sin trazas que puedan incluir rutas o valores
    "PLR0911", "PLR0913", "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Quita `SSLKEYLOGFILE` del entorno antes de importar nada que pueda crear un contexto TLS.
"faro_engine/__main__.py" = ["E402"]
"tests/**" = ["S101", "S105", "S106", "S603", "PLR2004", "ARG001", "S104", "PLC0415"]
# Herramientas de empaquetado (spec F1b T2): lanzan PyInstaller y el ejecutable, e importan
# dentro de cada comprobación para que la variante `base` funcione sin las deps de F1b.
"scripts/**" = ["S603", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["faro_engine", "tests", "scripts"]

# Dependencias sin tipos (spec F1b T2): APScheduler 3, sqlite-vec y PyInstaller (hooks).
[[tool.mypy.overrides]]
module = ["apscheduler.*", "sqlite_vec", "PyInstaller.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=faro_engine",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    # La integración con wp-env solo corre si se pide: `pytest -m wp_env --no-cov`.
    "-m",
    "not wp_env",
]
markers = [
    "slow: pruebas de más de 2 s (solo CI nocturno)",
    "wp_env: integración motor ↔ plugin contra wp-env (Docker); CI wp-plugin-integration",
    "vec: carga de sqlite-vec en la base cifrada (ADR 0009 criterio 5; sqlite-vec solo en dev)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["faro_engine"]
branch = true
# Mide también los subprocesos `python -m faro_engine` de las pruebas de protocolo.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.faro.coverage]
# Umbral por módulo (spec F0 §4.7 y skill pruebas-faro); lo aplica tests/conftest.py.
strict_modules = [
    "faro_engine/core/security.py",
    "faro_engine/__main__.py",
    "faro_engine/core/operations.py",
    "faro_engine/core/protocol.py",
    "faro_engine/core/server.py",
    "faro_engine/core/db/connection.py",
    "faro_engine/core/db/migrations.py",
    # Canal de secretos, auditoría y filtro de logs (spec F1a T7, ADR 0010 y 0013).
    "faro_engine/core/secrets.py",
    "faro_engine/core/run_id.py",
    "faro_engine/core/audit.py",
    "faro_engine/core/redact.py",
    # Red saliente y firma del plugin (spec F1a T9, ADR 0011 y 0012).
    "faro_engine/net/guard.py",
    "faro_engine/net/urls.py",
    "faro_engine/net/client.py",
    "faro_engine/net/tls.py",
    "faro_engine/wordpress/signing.py",
    # Tabla de concesiones por ejecución de los agentes (spec F1b T3, ADR 0014 §1).
    "faro_engine/agents/grants.py",
    # Repositorios de la migración 0002: transiciones condicionales, topes y caducidad
    # (spec F1b T4, ADR 0016 §5).
    "faro_engine/core/store/common.py",
    "faro_engine/core/store/runs.py",
    "faro_engine/core/store/approvals.py",
    "faro_engine/core/store/autonomy_rules.py",
    "faro_engine/core/store/schedules.py",
    "faro_engine/core/store/credentials.py",
    "faro_engine/core/store/settings.py",
    "faro_engine/core/store/site_summaries.py",
    "faro_engine/core/store/checkpoints.py",
    "faro_engine/core/store/run_control.py",
    # Protocolo de agentes: concesiones, pausa y actividad (spec F1b T5, ADR 0014).
    "faro_engine/core/jobs/grants.py",
    "faro_engine/core/jobs/control.py",
    "faro_engine/core/jobs/activity.py",
    # Capa de IA: costo en micros, tope diario, orden de comprobaciones, mapeo de errores,
    # catálogo y endurecimiento de LiteLLM (spec F1b T6, ADR 0015 §1).
    "faro_engine/llm/pricing.py",
    "faro_engine/llm/limits.py",
    "faro_engine/llm/service.py",
    "faro_engine/llm/errors.py",
    "faro_engine/llm/catalog.py",
    "faro_engine/llm/hardening.py",
    "faro_engine/llm/litellm_client.py",
]
strict_fail_under = 95

[dependency-groups]
bundle = [
    "pyinstaller==6.22.3",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "sqlite-vec==0.1.9",
    "trustme==1.2.1",
]
