# CI de Faro (spec F0 §4.7, spec F1a §4.6, ADR 0005).
#
# Repositorio público: este workflow nunca usa `pull_request_target`, `workflow_run`,
# secretos ni runners propios (self-hosted). El GITHUB_TOKEN es de solo lectura.
# Todas las acciones están fijadas por SHA completo (Dependabot las actualiza).
# `ci-ok` es el único check requerido en la protección de `main`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  UV_VERSION: "0.11.33"
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  # Plugin de WordPress: PHP mínimo soportado y Composer fijo en el runner. Las versiones de
  # PHP, WordPress y WooCommerce de los contenedores las fijan los .wp-env*.json, y la de
  # wp-env, packages/wp-plugin/package-lock.json.
  PHP_VERSION: "8.1"
  COMPOSER_VERSION: "2.10.3"

defaults:
  run:
    shell: bash

jobs:
  ts:
    name: ts (interfaz y tipos compartidos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Formato (Prettier)
        run: npx --no-install prettier --check .

      - name: Lint (ESLint)
        run: npm run lint:ts

      - name: Tipos (tsc, desktop y shared)
        run: npm run typecheck --workspaces --if-present

      - name: Pruebas de la interfaz con cobertura (umbral 70 %)
        run: npm run test:desktop

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) verifica la librería nativa SQLCipher (spec F1a §4.6, ADR 0009).
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock

      - name: uv sync --locked
        run: uv sync --locked

      - name: Formato (ruff format)
        run: uv run --locked ruff format --check .

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Tipos (mypy --strict)
        run: uv run --locked mypy faro_engine tests scripts

      # Umbrales en pyproject.toml y tests/conftest.py: 80 % global, 95 % en los módulos de
      # [tool.faro.coverage] strict_modules (seguridad, protocolo y base cifrada).
      - name: Pruebas del motor con cobertura
        run: uv run --locked pytest

  core:
    name: core (núcleo Rust, Windows)
    runs-on: windows-latest
    # Los builds instrumentados de cargo llvm-cov viven en target/llvm-cov-target, aparte
    # de los de clippy (target/debug); engine_real reutiliza los instrumentados.
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm ci
        run: npm ci

      # `tauri::generate_context!` necesita `apps/desktop/dist`.
      - name: Build de la interfaz
        run: npm run build -w apps/desktop

      # rustup instala la versión exacta, componentes y target de rust-toolchain.toml.
      # llvm-tools-preview (llvm-profdata y llvm-cov de esa misma versión) solo hace falta
      # para la cobertura; por eso se añade aquí y no en rust-toolchain.toml.
      - name: Toolchain de rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustc -Vv
          cargo -V
          cargo clippy -V
          cargo fmt --version

      # La caché solo se guarda desde `main`; los PR la reutilizan sin escribirla.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formato (cargo fmt)
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Lint (clippy -D warnings)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      # Cobertura de Rust (spec F1a §4.6, T10). Versión fijada; el binario lo descarga
      # install-action y comprueba su checksum.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Pruebas del comprobador de umbrales (scripts/check-rust-coverage.mjs)
        run: npm run test:scripts

      # Reemplaza a `cargo test`: ejecuta las mismas pruebas (las mismas que `npm run
      # test:core`) con instrumentación. `clean --workspace` borra datos de cobertura
      # (.profraw) que pudiera traer la caché. El informe se genera antes de `engine_real`,
      # así que los umbrales miden solo estas pruebas.
      - name: Pruebas del núcleo con cobertura (cargo llvm-cov)
        id: coverage
        run: |
          cargo llvm-cov clean --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace
          cargo llvm-cov --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-report
          cargo llvm-cov report --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --json --summary-only --output-path "$RUNNER_TEMP/rust-coverage.json"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock

      - name: uv sync del motor (.venv para engine_real)
        run: uv sync --directory apps/engine --locked

      # Solo el binario de pruebas `engine_real`: nunca se ejecutan en CI otras pruebas
      # ignoradas (por ejemplo, las que tocan el llavero real del sistema). Corre con
      # `cargo llvm-cov --no-report` para reutilizar el build instrumentado del paso
      # anterior en lugar de compilar el crate otra vez; el informe ya está generado.
      - name: Arranque real del motor (engine_real, ignoradas por defecto)
        run: cargo llvm-cov --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-report --test engine_real -- --ignored engine_real

      # Umbrales: 80 % de líneas global y 95 % en src/vault/, src/secrets/, src/profile/ y
      # src/engine/protocol.rs. Corre aunque falle `engine_real`, siempre que haya informe.
      - name: Umbrales de cobertura del núcleo
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: node scripts/check-rust-coverage.mjs "$RUNNER_TEMP/rust-coverage.json"

  contracts:
    name: contracts (contratos generados al día)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock

      - name: npm ci
        run: npm ci

      - name: uv sync del motor
        run: uv sync --directory apps/engine --locked

      # Validación de timeout_seconds y secrets por operación (ADR 0010 §3, spec F1a T4b)
      # y de las reglas de agent-grants.json con los vectores compartidos con el motor
      # (ADR 0014 §1, spec F1b T3).
      - name: Pruebas del generador de contratos
        run: npm run test:contracts

      - name: Regenerar contratos
        run: npm run contracts

      # Incluye agent-grants.json: si el registro de agentes del motor cambia y el archivo no
      # se regenera (o se edita a mano), el diff lo detecta; si falta en el repositorio, la
      # comprobación de archivos sin versionar también.
      - name: Sin diferencias en packages/shared
        run: |
          if ! git diff --exit-code packages/shared; then
            echo "::error::Los contratos no están al día. Ejecuta 'npm run contracts' y sube los cambios de packages/shared."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all packages/shared)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::'npm run contracts' generó archivos nuevos en packages/shared sin versionar."
            exit 1
          fi

  # Plugin de WordPress (packages/wp-plugin, GPL-2.0-or-later, ADR 0008). Sin Docker:
  # estilo, análisis estático y zip de distribución.
  wp-plugin:
    name: wp-plugin (PHPCS, PHPStan y zip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none

      - name: Carpeta de caché de Composer
        id: composer-cache
        working-directory: packages/wp-plugin
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('packages/wp-plugin/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: composer validate (composer.lock al día)
        working-directory: packages/wp-plugin
        run: composer validate --no-check-publish --no-check-all

      # Solo herramientas de desarrollo: el plugin no tiene dependencias de Composer en
      # tiempo de ejecución y el zip no lleva vendor/.
      - name: composer install
        working-directory: packages/wp-plugin
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Estilo (PHPCS, WordPress Coding Standards y PHPCompatibilityWP 8.1+)
        working-directory: packages/wp-plugin
        run: composer phpcs

      - name: Análisis estático (PHPStan)
        working-directory: packages/wp-plugin
        run: composer phpstan

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Zip del plugin (dos builds seguidos con el mismo hash)
        run: |
          zip=packages/wp-plugin/dist/faro-wordpress.zip
          npm run build:wp-plugin
          first="$(sha256sum "$zip" | cut -d' ' -f1)"
          npm run build:wp-plugin
          second="$(sha256sum "$zip" | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::El zip del plugin no es determinista: $first != $second"
            exit 1
          fi
          echo "SHA-256 de faro-wordpress.zip: \`$first\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Contenido del zip (carpeta faro/, con LICENSE, sin pruebas ni herramientas)
        run: |
          zip=packages/wp-plugin/dist/faro-wordpress.zip
          list="$RUNNER_TEMP/faro-wordpress.txt"
          unzip -Z1 "$zip" > "$list"
          cat "$list"
          fail=0
          if grep -v '^faro/' "$list"; then
            echo "::error::El zip tiene entradas fuera de la carpeta faro/."
            fail=1
          fi
          if grep -E '(^|/)(tests|vendor|node_modules|dist)(/|$)|(^|/)\.|(^|/)composer\.(json|lock)$|(^|/)package(-lock)?\.json$|(^|/)php(cs|stan|unit)\.' "$list"; then
            echo "::error::El zip incluye pruebas, dependencias, archivos ocultos o configuración de desarrollo."
            fail=1
          fi
          for required in faro/LICENSE faro/faro.php faro/uninstall.php faro/readme.txt; do
            if ! grep -qxF "$required" "$list"; then
              echo "::error::Falta $required en el zip."
              fail=1
            fi
          done
          if ! unzip -p "$zip" faro/LICENSE | grep -q 'GNU GENERAL PUBLIC LICENSE'; then
            echo "::error::faro/LICENSE no contiene la GPL (ADR 0008)."
            fail=1
          fi
          exit "$fail"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faro-wordpress-zip
          path: packages/wp-plugin/dist/faro-wordpress.zip
          if-no-files-found: error
          retention-days: 7

  # PHPUnit del plugin dentro de WordPress real (wp-env + Docker del runner). Sin secretos:
  # los contenedores solo descargan WordPress, WooCommerce e imágenes públicas.
  wp-plugin-integration:
    name: wp-plugin-integration (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.3 + WordPress 7.1.2 + WooCommerce 11.1.2 (.wp-env.json); HPOS activado y desactivado.
          - config: actual
            wp-env-config: ""
          # PHP 8.1 + WordPress 6.0.16, sin WooCommerce (.wp-env.min.json, puertos 8890/8891).
          - config: minimo
            wp-env-config: .wp-env.min.json
    env:
      WP_ENV_CONFIG: ${{ matrix.wp-env-config }}
    defaults:
      run:
        working-directory: packages/wp-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none

      - name: Carpeta de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('packages/wp-plugin/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      # vendor/ (PHPUnit y polyfills) llega a los contenedores por el mapeo de .wp-env*.json.
      # composer.json fija la plataforma en PHP 8.1, así que sirve para PHP 8.1 y 8.3.
      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/wp-plugin/package-lock.json

      # wp-env y sus dependencias fijadas por packages/wp-plugin/package-lock.json.
      # --ignore-scripts: wp-env usa Docker y no necesita los binarios que instalan los
      # scripts de las dependencias de WordPress Playground.
      - name: npm ci (wp-env)
        run: npm ci --ignore-scripts

      - name: Carpeta de trabajo de wp-env
        run: echo "WP_ENV_HOME=$RUNNER_TEMP/wp-env" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wp-env
          key: wp-env-${{ matrix.config }}-${{ hashFiles('packages/wp-plugin/.wp-env*.json', 'packages/wp-plugin/package-lock.json') }}

      - name: Arrancar wp-env (un reintento si falla)
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG" ]; then args=(--config "$WP_ENV_CONFIG"); fi
          if ! npx --no-install wp-env start "${args[@]}"; then
            echo "::warning::wp-env no arrancó al primer intento; se reintenta una vez."
            npx --no-install wp-env stop "${args[@]}" || true
            sleep 15
            npx --no-install wp-env start "${args[@]}"
          fi

      - name: PHPUnit (HPOS activado si hay WooCommerce)
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG" ]; then args=(--config "$WP_ENV_CONFIG"); fi
          npx --no-install wp-env run tests-cli "${args[@]}" --env-cwd=wp-content/plugins/faro vendor/bin/phpunit

      - name: PHPUnit (HPOS desactivado)
        if: matrix.config == 'actual'
        run: npx --no-install wp-env run tests-cli --env-cwd=wp-content/plugins/faro env FARO_TEST_HPOS=0 vendor/bin/phpunit

      # Integración motor ↔ plugin (spec F1a §9.4), solo en `actual`: el motor corre dentro
      # de pytest con el modo de sitios locales contra http://localhost:8888 y un canal de
      # secretos simulado en memoria (sin llavero ni secretos de la CI).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.config == 'actual'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock

      # Con la carpeta de wp-env restaurada de la caché, wp-env cree que el sitio de
      # desarrollo ya está instalado y no lo instala, pero su base es nueva en cada
      # ejecución (PHPUnit no lo nota: el entorno de pruebas crea sus propias tablas).
      # Contraseña aleatoria y desechable: el sitio solo vive en este runner.
      - name: Instalar el sitio de desarrollo de wp-env si falta
        if: matrix.config == 'actual'
        run: |
          if ! npx --no-install wp-env run cli wp core is-installed; then
            npx --no-install wp-env run cli wp core install \
              --url=http://localhost:8888 --title=Faro --admin_user=admin \
              --admin_password="$(openssl rand -hex 16)" \
              --admin_email=wordpress@example.com --skip-email
          fi

      - name: Integración motor ↔ plugin (pytest -m wp_env)
        if: matrix.config == 'actual'
        working-directory: apps/engine
        env:
          FARO_WP_ENV_URL: http://localhost:8888
        run: |
          uv sync --locked
          uv run --locked pytest -m wp_env --no-cov -p no:cacheprovider

      - name: Apagar wp-env
        if: always()
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG" ]; then args=(--config "$WP_ENV_CONFIG"); fi
          npx --no-install wp-env stop "${args[@]}" || true

  audit:
    name: audit (dependencias y secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz (comprobado contra el checksums.txt del release).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: npm audit (dependencias de producción, nivel alto o crítico)
        run: npm audit --omit=dev --audit-level=high

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2

      # Se invoca el binario directamente para no instalar la toolchain de rust-toolchain.toml.
      # Se ejecuta desde src-tauri para que cargo-audit lea `.cargo/audit.toml` (ignorados
      # solo de Linux, revisados por revisor-seguridad, y `deny` de unsound/unmaintained).
      - name: cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo-audit audit --file Cargo.lock

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock

      - name: pip-audit sobre el lock exportado del motor
        run: |
          req="$RUNNER_TEMP/engine-requirements.txt"
          uv export --directory apps/engine --locked --all-groups --no-emit-project \
            --format requirements-txt --output-file "$req"
          uvx "pip-audit@${PIP_AUDIT_VERSION}" --requirement "$req" --require-hashes --disable-pip \
            --progress-spinner off

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none

      # Sobre composer.lock, sin instalar nada; incluye las herramientas de desarrollo,
      # que se ejecutan en la CI.
      - name: composer audit (plugin de WordPress)
        working-directory: packages/wp-plugin
        run: composer audit --locked

      - name: Instalar gitleaks (versión y SHA-256 fijos)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Reglas por defecto + excepciones puntuales (ruta Y valor) de .github/gitleaks.toml.
      - name: gitleaks sobre todo el historial
        run: gitleaks git --config .github/gitleaks.toml --redact --no-banner --verbose --exit-code 1 .

  ci-ok:
    name: ci-ok
    if: always()
    needs: [ts, engine, core, contracts, wp-plugin, wp-plugin-integration, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los trabajos terminaron en success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::Trabajos que no terminaron en success: $failed"
            exit 1
          fi
          echo "Todos los trabajos necesarios terminaron en success."
