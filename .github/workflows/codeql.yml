# CodeQL de Faro (spec F0 §4.7, ADR 0005): configuración avanzada.
# No activar además la "configuración por defecto" de CodeQL en Settings: ambas no pueden
# convivir y GitHub rechaza los resultados de este workflow si la otra está activa.
#
# Repositorio público: sin `pull_request_target`, sin secretos, sin runners propios.
#
# Separación de privilegios (revisión de seguridad T12):
# - `analyze` solo tiene `contents: read`. Es el único trabajo que ejecuta código de
#   terceros: para Rust con `build-mode: none`, CodeQL usa rust-analyzer, que compila y
#   ejecuta los `build.rs` y compila las macros de las dependencias (documentación de
#   GitHub, "Building Rust"). No se instala nada de npm ni se hace build de la interfaz.
# - `upload` es el único trabajo con `security-events: write`: no ejecuta código del
#   repositorio ni de dependencias; solo descarga el SARIF y lo sube a Code Scanning.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
          - language: javascript-typescript
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          # Rust en Windows: es la plataforma objetivo del núcleo (en Linux Tauri pide WebKitGTK).
          - language: rust
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL para Rust solo requiere rustup y cargo (ya presentes en el runner). Se
      # instala explícitamente la toolchain fija de rust-toolchain.toml para que la versión
      # quede en el log. `generate_context!` de Tauri lee `apps/desktop/dist`: se crea un
      # marcador vacío en lugar de ejecutar `npm ci` y el build de la interfaz.
      - if: matrix.language == 'rust'
        name: Preparar Rust (toolchain fija, sin npm)
        run: |
          rustup toolchain install
          rustc -Vv
          mkdir -p apps/desktop/dist
          printf '<!doctype html><title>Faro</title>\n' > apps/desktop/dist/index.html

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      # Sin subida desde aquí: este trabajo no tiene `security-events: write`.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  upload:
    name: upload (${{ matrix.language }})
    needs: analyze
    # Sube los lenguajes que sí terminaron aunque otro haya fallado (el que falló no tiene
    # artefacto y su subida también falla, lo que deja el error visible).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      # Solo para que upload-sarif resuelva el commit; no se ejecuta nada del repositorio.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif

      # El SARIF ya incluye la categoría `/language:<lenguaje>` que fijó `analyze`.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
